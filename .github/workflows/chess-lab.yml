name: Chess Lab — Stockfish 18 NNUE

on:
  push:
    branches: [main]
    paths:
      - 'games/**/*.pgn'
      - 'analyze.py'
      - 'requirements.txt'
      - '.github/workflows/chess-lab.yml'
  workflow_dispatch:
    inputs:
      pgn:
        description: 'PGN path, e.g. games/current.pgn'
        required: true
        default: 'games/2026-08-28-smith-morra.pgn'
      depth:
        description: 'Critical-position Stockfish depth'
        required: false
        default: '20'
      scan_depth:
        description: 'Fast first-pass Stockfish depth'
        required: false
        default: '14'

permissions:
  contents: write

env:
  STOCKFISH_VERSION: '18'
  STOCKFISH_ARCHIVE: 'stockfish-ubuntu-x86-64-avx2.tar'
  STOCKFISH_SHA256: '536c0c2c0cf06450df0bfb5e876ef0d3119950703a8f143627f990c7b5417964'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install official Stockfish 18 NNUE
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/official-stockfish/Stockfish/releases/download/sf_18/${STOCKFISH_ARCHIVE}"
          ARCHIVE="$RUNNER_TEMP/${STOCKFISH_ARCHIVE}"
          DEST="$RUNNER_TEMP/stockfish18"

          curl -L --fail --retry 3 "$URL" -o "$ARCHIVE"
          echo "${STOCKFISH_SHA256}  ${ARCHIVE}" | sha256sum -c -

          mkdir -p "$DEST"
          tar -xf "$ARCHIVE" -C "$DEST"

          STOCKFISH_BIN=$(find "$DEST" -type f -name 'stockfish*' ! -name '*.tar' | head -n 1)
          test -n "$STOCKFISH_BIN"
          chmod +x "$STOCKFISH_BIN"
          echo "STOCKFISH_PATH=$STOCKFISH_BIN" >> "$GITHUB_ENV"

          VERSION_OUTPUT=$(printf 'uci\nquit\n' | "$STOCKFISH_BIN" | head -n 8)
          echo "$VERSION_OUTPUT"
          echo "$VERSION_OUTPUT" | grep -q 'Stockfish 18'

      - name: Select PGN
        id: select
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PGN="${{ inputs.pgn }}"
            DEPTH="${{ inputs.depth }}"
            SCAN_DEPTH="${{ inputs.scan_depth }}"
          else
            PGN=$(find games -name '*.pgn' -type f | sort | tail -n 1)
            DEPTH=20
            SCAN_DEPTH=14
          fi
          test -n "$PGN"
          test -f "$PGN"
          echo "pgn=$PGN" >> "$GITHUB_OUTPUT"
          echo "depth=$DEPTH" >> "$GITHUB_OUTPUT"
          echo "scan_depth=$SCAN_DEPTH" >> "$GITHUB_OUTPUT"

      - name: Analyze with Stockfish 18 NNUE
        run: |
          python analyze.py "${{ steps.select.outputs.pgn }}" \
            --scan-depth "${{ steps.select.outputs.scan_depth }}" \
            --depth "${{ steps.select.outputs.depth }}" \
            --multipv 3 \
            --verify-threshold 40 \
            --stockfish "$STOCKFISH_PATH" \
            --outdir analysis

      - name: Commit analysis
        run: |
          git config user.name 'chess-lab-bot'
          git config user.email 'chess-lab-bot@users.noreply.github.com'
          git add analysis
          if git diff --cached --quiet; then
            echo 'No analysis changes.'
          else
            git commit -m 'Analyze PGN with Stockfish 18 NNUE'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
